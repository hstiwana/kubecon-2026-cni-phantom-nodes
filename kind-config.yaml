# kind cluster config for CNI phantom nodes demo
# Disables default CNI so we can install Cilium with constrained IPAM
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cni-phantom-demo
networking:
  disableDefaultCNI: true   # We'll install Cilium manually
  podSubnet: "10.244.0.0/24"  # Intentionally small — only 254 IPs
nodes:
- role: control-plane
- role: worker
- role: worker
- role: worker
